plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

// mod_version is what the game shows (mods list, neoforge.mods.toml via the manifest); the jar name adds the MC version
ext.mod_version = '1.1.0'
version = "${mod_version}-1.21.1"
group = 'com.bromax.exofall'

base {
    archivesName = 'exofall'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'neoforge.logging.console.level', 'info'
        modSource project.sourceSets.main
    }
    client {}
    server {}
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.265"
    // Mob models/animations. Compiled against the exact GeckoLib jar S202 ships (copy it into libs/,
    // libs/ is git-ignored: ~/Documents/curseforge/minecraft/Instances/S202Neoforge/mods/).
    implementation files('libs/geckolib-neoforge-1.21.1-4.9.3.jar')
    // Baubles (Curios slots). Same jar S202 ships, also git-ignored in libs/.
    implementation files('libs/curios-neoforge-9.5.1+1.21.1.jar')
    // JEI page for the Shellrock table (optional at runtime). Same jar as the Exofall Testing instance, git-ignored in libs/.
    compileOnly files('libs/jei-1.21.1-neoforge-19.64.0.455.jar')
    // Field Guide (optional at runtime): 5x5 recipe page processor. Same jar S202 ships, git-ignored in libs/.
    compileOnly files('libs/Patchouli-1.21.1-93-NEOFORGE.jar')
}

jar {
    from('LICENSE') { rename { "LICENSE_exofall" } }
    manifest {
        attributes([
            'Specification-Title'   : 'exofall',
            'Specification-Vendor'  : 'BROMAX',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': "${mod_version}",
            'Implementation-Vendor' : 'BROMAX',
        ])
    }
}

// Copies the built jar into a TEST instance (never the shipping S202 instance, its mods folder gets exported).
// Override with: ./gradlew deploy -PdeployInstance="Some Instance". Only run with the game closed.
tasks.register('deploy') {
    dependsOn build
    doLast {
        def instance = project.findProperty('deployInstance') ?: 'Exofall Testing'
        def modsDir = file("/home/glenn/Documents/curseforge/minecraft/Instances/${instance}/mods")
        if (!modsDir.isDirectory()) {
            throw new GradleException("[DEPLOY] No mods folder at ${modsDir}. Create the instance or pass -PdeployInstance=...")
        }
        // Copy to a temp name, then move, so a running game never sees a half-written jar.
        def tmp = new File(modsDir, ".exofall-deploy.tmp")
        copy {
            from layout.buildDirectory.file("libs/exofall-${version}.jar")
            into modsDir
            rename { tmp.name }
        }
        delete fileTree(dir: modsDir, include: 'exofall-*.jar')
        tmp.renameTo(new File(modsDir, "exofall-${version}.jar"))
        println "[DEPLOY] exofall ${version} -> ${instance}"
    }
}
